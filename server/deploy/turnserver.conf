# /etc/turnserver.conf -- the TURN relay for online play (coturn).
#
# Most pairs of browsers connect directly (STUN tells each its public
# address). Some cannot -- symmetric NATs, mobile hotspots, carrier-grade NAT
# -- and WebRTC then relays their packets through this server. A UMK3 match
# is a few hundred bytes a tick each way, so a relay costs little.
#
# Credentials are not stored: server/signal.js hands each player a
# time-limited username and an HMAC of it under the shared secret below
# (coturn's REST scheme, `use-auth-secret`). The same secret goes in
# /home/sushi/umk3/server/signal.env as UMK3_TURN_SECRET, with
#   UMK3_TURN_URLS=turn:<public IPv4>:3478?transport=udp,turn:<public IPv4>:3478?transport=tcp
# The URLs name the IP, not umk3.abdu.cloud: that name is proxied by
# Cloudflare, which carries HTTP and WebSockets but not TURN.
#
# Firewall (ufw): 3478/udp, 3478/tcp and the relay range below, udp.

listening-port=3478
min-port=49160
max-port=49260

fingerprint
use-auth-secret
static-auth-secret=__SET_ON_THE_SERVER__
realm=umk3.abdu.cloud

# No TLS listener (443 is nginx's) and no admin console.
no-tls
no-dtls
no-cli

# A relay for two game clients, not a way into this machine or its networks:
# no relaying to loopback, private, link-local, carrier-grade NAT or
# multicast addresses.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Bounded. max-bps is BYTES a second, each direction: a match needs about
# 18 KB/s with headers (56 ticks of a ~250-byte sprite list), so 100 KB/s
# is room for catching up and nothing like a general-purpose relay.
# 40 allocations in all (a browser makes one or two), 4 per username.
max-bps=100000
total-quota=40
user-quota=4
stale-nonce=600

syslog
simple-log
